<!doctype html>
<html lang="ja">
<head>
<meta name="description" content="空に浮かぶ街ARCA。結晶のタワー、桜のテラス、ポーカー、Origin.のワークスペースを体験できます。">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>仮想都市ARCA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 青空の3Dワールドに、ガラスのHUDを四隅と下中央のドックに浮かべる。パネルはPCでは右上、スマホでは下から出る */
:root{
  --bg:#EAF0FF;
  --ink:#1E2050;
  --ink-soft:#5D6394;
  --glass:rgba(255,255,255,.62);
  --glass-strong:rgba(255,255,255,.9);
  --panel-solid:#FFFFFF;
  --line:rgba(122,104,230,.22);
  --line-strong:rgba(122,104,230,.4);
  --accent:#7B3CF0;
  --live:#2FBF52;
  --on-zone:#141830;
  --shadow:rgba(60,50,140,.16);
  --tile:linear-gradient(150deg,#A58CFF,#5F84FF);
  --btn:linear-gradient(135deg,#8B4BFF,#5A4BFF);
  --rainbow:linear-gradient(90deg,#FF7AC6,#B06BFF 22%,#4CD3FF 45%,#7EEA43 68%,#FFE63B 84%,#FF9A1F);
  --rim:linear-gradient(135deg,#FF7AC6,#B06BFF 35%,#4CD3FF 70%,#7EEA43);
  --z-shop:#FFC83A; --z-office:#4CD3FF; --z-game:#FF2D95; --z-stage:#A46BFF; --z-park:#7EEA43;
  --sky-top:#3B86FF; --sky-mid:#8CC2FF; --sky-horizon:#CFE2FF; --sky-bottom:#B9D3FF;
  --floor:#FFFFFF; --floor-tint:#ECE5FF; --world-side:#F4F1FF; --world-line:#CFC4F6;
  --f-display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0D2C; --ink:#F1F0FF; --ink-soft:#B4B5E2; --glass:rgba(28,26,78,.58); --glass-strong:rgba(24,22,70,.92);
    --panel-solid:#17154A; --line:rgba(176,160,255,.24); --line-strong:rgba(176,160,255,.42); --accent:#C29BFF;
    --live:#5BE07A; --shadow:rgba(0,0,0,.45); --tile:linear-gradient(150deg,#6B55E0,#3C5BD6);
    --sky-top:#050822; --sky-mid:#16164C; --sky-horizon:#3A2B7A; --sky-bottom:#1A1446;
    --floor:#262269; --floor-tint:#17134A; --world-side:#2E2A72; --world-line:#5A50B4;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0D2C; --ink:#F1F0FF; --ink-soft:#B4B5E2; --glass:rgba(28,26,78,.58); --glass-strong:rgba(24,22,70,.92);
  --panel-solid:#17154A; --line:rgba(176,160,255,.24); --line-strong:rgba(176,160,255,.42); --accent:#C29BFF;
  --live:#5BE07A; --shadow:rgba(0,0,0,.45); --tile:linear-gradient(150deg,#6B55E0,#3C5BD6);
  --sky-top:#050822; --sky-mid:#16164C; --sky-horizon:#3A2B7A; --sky-bottom:#1A1446;
  --floor:#262269; --floor-tint:#17134A; --world-side:#2E2A72; --world-line:#5A50B4;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
#world{position:fixed;inset:0;background:var(--bg)}
#world canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

#hud{position:fixed;inset:0;z-index:2;pointer-events:none;display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);grid-template-rows:auto auto 1fr auto auto;
  grid-template-areas:"tl . tr" "help . tr" ". . ." "log . ." "chat dock ctrl";gap:10px 14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-bottom,0px))}
.pe{pointer-events:auto}
.glass{background:var(--glass);border:1px solid var(--line);box-shadow:0 8px 24px var(--shadow);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3)}
.rim{border:1.5px solid transparent;background:linear-gradient(var(--glass-strong),var(--glass-strong)) padding-box,var(--rim) border-box}

.tl{grid-area:tl;display:flex;flex-direction:column;align-items:flex-start;gap:8px;min-width:0}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:38px;height:38px;flex:none;filter:drop-shadow(0 4px 10px var(--shadow))}
.logo{display:flex;flex-direction:column;line-height:1}
.logo b{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.08em}
.logo i{display:block;height:4px;border-radius:4px;margin-top:5px;background:var(--rainbow)}
.logo small{font-weight:700;font-size:10.5px;letter-spacing:.14em;color:var(--ink-soft);margin-top:5px}
.pills{display:flex;flex-wrap:wrap;gap:6px;max-width:100%}
.chip-s{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;font-weight:700;font-size:12.5px;white-space:nowrap;max-width:100%;min-width:0}
.chip-s b{font-weight:500}
.live{width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 3px color-mix(in srgb,var(--live) 25%,transparent);flex:none}
.where{--zc:var(--accent)}
.where svg{width:16px;height:16px;color:var(--zc);flex:none}
.where .name{overflow:hidden;text-overflow:ellipsis;min-width:0}
.where b{color:var(--ink-soft)}

.help{grid-area:help;align-self:start;justify-self:start;width:min(300px,100%);border-radius:20px;padding:12px 14px}
.help h2{font-family:var(--f-display);font-size:14px;margin:0 0 6px;font-weight:800;letter-spacing:.04em}
.help ul{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:12.5px;color:var(--ink-soft)}
.help li{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.help .tip{margin:8px 0 0;font-size:12px;color:var(--ink-soft);line-height:1.55}
.help .close{margin-top:8px;border:0;background:none;padding:2px 0;font-size:12px;font-weight:700;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
kbd{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:6px;border:1px solid var(--line-strong);background:var(--glass-strong);color:var(--ink);white-space:nowrap}
html:not(.touch) .only-touch,html.touch .only-mouse{display:none}

.tr{grid-area:tr;justify-self:end;align-self:start}
.radar{width:148px;height:148px;border-radius:50%;padding:4px;background:conic-gradient(#FF7AC6,#B06BFF,#4CD3FF,#7EEA43,#FFE63B,#FF9A1F,#FF7AC6);box-shadow:0 10px 28px var(--shadow)}
#minimap{display:block;width:100%;height:100%;border-radius:50%}
body.sheet-open .radar{visibility:hidden}

#log{grid-area:log;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start;pointer-events:none;min-width:0;max-width:380px}
#log li{border-radius:14px;padding:3px 11px;font-size:12.5px;max-width:100%;overflow-wrap:anywhere;transition:opacity .6s;box-shadow:none}
#log li.old{opacity:0}
#log .who{font-weight:700;margin-right:6px}
#log .who::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px;vertical-align:1px}

.chat{grid-area:chat;align-self:end;width:min(380px,100%);display:flex;flex-direction:column;gap:8px;min-width:0}
.emotes{display:flex;gap:5px;padding:6px 8px;border-radius:20px;align-self:flex-start;flex-wrap:nowrap;max-width:100%}
.emo{width:34px;height:34px;flex:none;border-radius:50%;border:0;padding:0;background:none;cursor:pointer;transition:transform .15s}
.emo img{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 0 0 1.5px var(--line-strong)}
.emo:hover{transform:translateY(-2px) scale(1.06)}
#chatForm{display:flex;align-items:center;gap:6px;border-radius:999px;padding:5px}
#chatForm:focus-within{outline:3px solid var(--accent);outline-offset:1px}
#chatInput{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:14px;color:var(--ink);padding:6px 10px;outline:none}
#chatInput::placeholder{color:var(--ink-soft)}
.emo-toggle{display:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--tile);color:#FFFFFF;cursor:pointer;place-items:center;flex:none}
.emo-toggle svg{width:20px;height:20px}
.send{border:0;border-radius:999px;background:var(--btn);color:#FFFFFF;font-weight:700;font-size:13px;padding:7px 16px;cursor:pointer;flex:none}

.dock{grid-area:dock;justify-self:center;align-self:end;display:flex;gap:4px;padding:8px 10px 6px;border-radius:26px}
.dk{display:flex;flex-direction:column;align-items:center;gap:3px;width:58px;background:none;border:0;cursor:pointer;color:var(--ink);font-size:11px;font-weight:700;padding:0}
.dk .ic{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--tile);color:#FFFFFF;box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 6px 14px var(--shadow);transition:transform .15s}
.dk .ic svg{width:23px;height:23px}
.dk:hover .ic{transform:translateY(-2px)}
.dk[aria-pressed="true"] .ic{background:var(--btn)}

.ctrl{grid-area:ctrl;align-self:end;justify-self:end;display:flex;align-items:flex-end;gap:12px}
.joy{display:none;width:112px;height:112px;border-radius:50%;position:relative;touch-action:none;flex:none}
html.touch .joy{display:block}
.joy .knob{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:var(--btn);box-shadow:0 4px 12px var(--shadow),inset 0 2px 0 rgba(255,255,255,.4)}
.acts{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.act{border:0;border-radius:999px;background:var(--btn);color:#FFFFFF;font-weight:700;font-size:14px;padding:10px 18px;box-shadow:0 8px 22px var(--shadow);display:inline-flex;gap:8px;align-items:center;cursor:pointer;animation:nudge 1.8s ease-in-out infinite}
.act kbd{background:transparent;border-color:currentColor;color:inherit}
html.touch .act kbd{display:none}
.jump{display:none}
html.touch .jump{display:inline-flex;width:64px;height:64px;border-radius:50%;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--ink);cursor:pointer}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

.banner{--zc:var(--accent);position:fixed;left:50%;top:24%;z-index:3;transform:translate(-50%,-10px);opacity:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;width:max-content;max-width:calc(100vw - 32px);transition:opacity .4s,transform .4s}
.banner.show{opacity:1;transform:translate(-50%,0)}
.b-kind{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.12em;padding:4px 14px;border-radius:999px;background:var(--zc);color:var(--on-zone)}
.b-kind svg{width:14px;height:14px}
.b-name{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,46px);line-height:1.15;text-wrap:balance;text-shadow:0 0 2px var(--bg),0 0 16px var(--bg),0 0 34px var(--bg)}
.b-desc{font-size:13px;color:var(--ink-soft);font-weight:700;text-shadow:0 0 3px var(--bg),0 0 12px var(--bg)}
.b-bar{width:120px;height:4px;border-radius:4px;background:var(--rainbow)}

.sheet{--zc:var(--accent);position:fixed;z-index:4;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 16px);
  width:min(390px,calc(100vw - 32px));max-height:calc(100% - 140px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;
  color:var(--ink);border-radius:26px;box-shadow:0 18px 48px var(--shadow);padding:18px 18px 20px;animation:sheetIn .25s ease-out;
  -webkit-backdrop-filter:blur(18px) saturate(1.3);backdrop-filter:blur(18px) saturate(1.3)}
@keyframes sheetIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sheet header{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;margin-bottom:14px}
.s-emb{grid-row:1/span 2;width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:var(--zc);color:var(--on-zone)}
.s-emb svg{width:26px;height:26px}
.chip{justify-self:start;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--ink-soft)}
.sheet h2{grid-column:2;margin:0;font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1.2;text-wrap:balance}
#sheetClose{grid-column:3;grid-row:1/span 2;width:36px;height:36px;border-radius:50%;border:1px solid var(--line-strong);background:var(--glass-strong);font-size:18px;line-height:1;cursor:pointer}
.lead{margin:0 0 12px;color:var(--ink-soft);font-size:13.5px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:18px;background:var(--glass)}
.glyph{width:44px;height:44px;border-radius:14px;background:var(--c);color:var(--on-zone);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:18px}
.glyph svg{width:24px;height:24px}
.face{width:44px;height:44px;border-radius:50%;display:block}
.time{width:44px;font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums;text-align:center}
.row .t{font-weight:700;font-size:14px;line-height:1.35}
.row .s{font-size:12px;color:var(--ink-soft)}
.btn{font-weight:700;font-size:12.5px;border-radius:999px;padding:7px 13px;border:1px solid var(--line-strong);background:var(--glass-strong);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--btn);border-color:transparent;color:#FFFFFF}
.btn.wide{width:100%;padding:11px 14px;font-size:14px}
.stack{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.note{margin:12px 0 0;font-size:12px;color:var(--ink-soft)}
.warp{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.warp button{width:100%;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:0 12px;align-items:center;text-align:left;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:8px 14px 8px 8px;cursor:pointer}
.warp button:hover{border-color:var(--c)}
.warp .sw{width:36px;height:36px;border-radius:12px;background:var(--c);color:var(--on-zone);display:grid;place-items:center;grid-row:1/span 2}
.warp .sw svg{width:20px;height:20px}
.warp .wn{font-weight:700}
.warp .wk{grid-column:2;font-size:12px;color:var(--ink-soft)}
.warp .here{grid-column:3;grid-row:1/span 2;font-size:11px;font-weight:700;color:var(--ink-soft)}
.pad{width:100%;height:150px;border-radius:20px;font-weight:700;font-size:17px;cursor:pointer;display:grid;place-items:center;padding:12px;background:var(--glass);color:var(--ink);border:1px solid var(--line)}
.pad[data-s="wait"]{background:var(--line-strong)}
.pad[data-s="go"]{background:var(--z-game);color:var(--on-zone);border-color:transparent}
.best{margin:10px 0 0;font-size:13px;color:var(--ink-soft)}
.best b{color:var(--ink)}
.field{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink-soft);margin:14px 0 6px}
.field:first-child{margin-top:0}
.text{width:100%;font:inherit;font-size:15px;padding:9px 12px;border-radius:12px;border:1px solid var(--line-strong);background:var(--glass-strong);color:var(--ink)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid var(--panel-solid);background:var(--c);box-shadow:0 0 0 1px var(--line-strong);cursor:pointer}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg .btn[aria-pressed="true"]{background:var(--ink);color:var(--panel-solid);border-color:var(--ink)}
.btn:disabled{opacity:.55;cursor:default}
.row.me{border-color:var(--zc);box-shadow:inset 0 0 0 1px var(--zc)}
.wish{display:flex;gap:8px;align-items:center}
.wish .text{flex:1;min-width:0}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 40%);transform:translate(-50%,8px);z-index:5;background:var(--ink);color:var(--panel-solid);font-weight:700;font-size:13px;padding:10px 16px;border-radius:999px;width:max-content;max-width:calc(100vw - 32px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
#flash{position:fixed;inset:0;z-index:6;background:var(--panel-solid);opacity:0;pointer-events:none}
#flash.on{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
#fallback{position:fixed;inset:0;z-index:9;display:grid;place-items:center;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));text-align:center;background:var(--bg);color:var(--ink);font-weight:700}

@media (max-width:999px){
  #hud{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto 1fr auto auto auto;grid-template-areas:"tl tr" "help tr" ". ." "log ." "chat ctrl" "dock dock"}
}
@media (max-width:640px){
  #hud{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto 1fr auto auto auto auto;grid-template-areas:"tl tr" "help help" ". ." "log log" "ctrl ctrl" "chat chat" "dock dock";gap:8px 10px}
  .chat{width:100%}
  .ctrl{justify-self:stretch;justify-content:space-between}
  .radar{width:100px;height:100px;padding:3px}
  .logo b{font-size:23px}
  .logo small{display:none}
  .help{width:100%}
  .dock{justify-self:stretch;justify-content:space-between;padding:6px 6px 4px}
  .dk{width:auto;flex:1;font-size:10px}
  .dk .ic{width:40px;height:40px;border-radius:14px}
  .sheet{left:0;right:0;bottom:0;top:auto;width:auto;max-height:66%;border-radius:26px 26px 0 0;border-bottom:0;
    padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
}
html.touch #hud{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto 1fr auto auto auto auto;grid-template-areas:"tl tr" "help help" ". ." "log log" "ctrl ctrl" "chat chat" "dock dock"}
html.touch .chat{width:100%}
html.touch .ctrl{justify-self:stretch;justify-content:space-between}
html.touch .dock{justify-self:center}
html.touch .emotes:not(.open){display:none}
html.touch .emo-toggle{display:grid}
@media (max-width:640px){
  .emotes:not(.open){display:none}
  .emo-toggle{display:grid}
}
@media (prefers-reduced-motion: reduce){
  .act{animation:none}
  .banner,.toast{transition:opacity .2s}
  #flash.on{animation-duration:.25s}
}

/* ARCA living city: readable glass, a calm modal surface and explicit day/night. */
[hidden]{display:none!important}
body{margin:0}
.theme-switch{border-radius:99px;padding:8px 13px;cursor:pointer;font-size:11px;font-weight:700;min-height:36px}
#sheetBackdrop{position:fixed;inset:0;z-index:3;background:rgba(17,18,45,.22);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{background:var(--glass-strong);width:min(470px,calc(100vw - 40px));max-height:calc(100dvh - 48px);padding:23px;box-shadow:0 24px 80px rgba(39,27,83,.22);border:1px solid var(--line-strong)}
.sheet header{position:sticky;top:-23px;z-index:2;margin:-23px -23px 20px;padding:22px 23px 18px;background:var(--glass-strong);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
body.sheet-open #hud,body.sheet-open #world{pointer-events:none}
body.sheet-open #banner{display:none}
#sheetBody{overflow-wrap:anywhere;min-width:0}
#sheetClose{min-width:40px;min-height:40px}
#hud .brand{padding:13px 16px;border:1px solid var(--line);border-radius:20px;background:var(--glass);backdrop-filter:blur(12px)}
#hud .logo b{letter-spacing:.14em;font-size:25px}
.dock{box-shadow:0 12px 36px var(--shadow)}
@media(max-width:640px){.sheet{left:8px;right:8px;bottom:8px;top:auto;width:auto;max-height:calc(100dvh - 32px);border-radius:24px;padding:18px}.sheet header{top:-18px;margin:-18px -18px 17px;padding:17px 18px}.theme-switch{padding:6px 10px;min-height:32px}#hud .brand{padding:9px 12px}.sheet h2{font-size:20px}.pills{gap:4px}.chip-s{font-size:11px;padding:0 9px}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}.dk .ic{transition:none}}
</style>
</head>
<body>


<div id="world" aria-label="仮想都市ARCAの3D空間"></div>

<div id="hud">
  <header class="tl">
    <div class="brand">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <defs><linearGradient id="lgA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7AC6"/><stop offset=".5" stop-color="#B06BFF"/><stop offset="1" stop-color="#4CD3FF"/></linearGradient></defs>
        <circle cx="24" cy="24" r="11" fill="#FFFFFF"/><circle cx="24" cy="24" r="11" fill="none" stroke="url(#lgA)" stroke-width="3"/>
        <ellipse cx="24" cy="25" rx="21" ry="7" fill="none" stroke="url(#lgA)" stroke-width="3" transform="rotate(-18 24 24)"/>
        <circle cx="24" cy="24" r="4.5" fill="#4CD3FF"/>
      </svg>
      <span class="logo"><b>ARCA</b><i></i><small>VIRTUAL CITY・試作版</small></span>
    </div>
    <div class="pills">
      <span class="chip-s glass"><i class="live"></i>街の住民 <b class="num" id="onlineN">0</b> NPC</span>
      <span class="chip-s glass where" id="where"><span id="whereIcon"></span><span class="name" id="whereName">中央広場</span><b class="num" id="whereCount">0</b>人</span>
    </div>
  </header>

  <div class="help glass rim pe" id="help">
    <h2>あそびかた</h2>
    <ul class="only-mouse">
      <li><kbd>WASD</kbd>歩く <kbd>Shift</kbd>走る <kbd>Space</kbd>跳ぶ</li>
      <li><kbd>クリック</kbd>そこへ歩く・人に話しかける</li>
      <li><kbd>ドラッグ</kbd>見まわす（上へで見上げる）</li>
      <li><kbd>1〜7</kbd>表情 <kbd>T</kbd>話す <kbd>E</kbd>案内ボード</li>
    </ul>
    <ul class="only-touch">
      <li>左下のスティックで歩く</li>
      <li>タップした場所まで歩く・人に話しかける</li>
      <li>ドラッグで見まわす・2本指でズーム</li>
    </ul>
    <p class="tip">ゲーム機でポーカー、公園の掲示板でニュース、オフィス通りのOrigin.で仕事をはじめられます。</p>
    <button class="close" id="helpClose" type="button">とじる</button>
  </div>

  <aside class="tr"><button class="theme-switch glass pe" id="themeSwitch" type="button" aria-label="夜の街に切り替え">夜の街へ</button><div class="radar"><canvas id="minimap" width="140" height="140" aria-label="ミニマップ"></canvas></div></aside>

  <ol id="log" aria-live="polite"></ol>

  <section class="chat">
    <div class="emotes glass pe" id="emotes" role="group" aria-label="表情を変える"></div>
    <form id="chatForm" class="glass pe" autocomplete="off">
      <button type="button" class="emo-toggle" id="emoToggle" aria-label="表情を選ぶ" aria-expanded="false"></button>
      <input id="chatInput" maxlength="40" placeholder="ひとこと話す" aria-label="ひとこと話す" enterkeyhint="send">
      <button class="send" type="submit">送信</button>
    </form>
  </section>

  <nav class="dock glass rim pe" id="dock" aria-label="メニュー"></nav>

  <section class="ctrl">
    <div class="joy glass pe" id="joy" aria-label="移動スティック"><div class="knob"></div></div>
    <div class="acts">
      <button class="act pe" id="btnAct" type="button" hidden><span id="actLabel">案内ボードを見る</span><kbd>E</kbd></button>
      <button class="jump glass pe" id="btnJump" type="button">ジャンプ</button>
    </div>
  </section>
</div>

<div class="banner" id="banner" aria-live="polite"><span class="b-kind" id="bKind"></span><strong class="b-name" id="bName"></strong><span class="b-bar"></span><span class="b-desc" id="bDesc"></span></div>

<div id="sheetBackdrop" hidden></div>
<aside class="sheet rim" id="sheet" hidden role="dialog" aria-modal="true" tabindex="-1" aria-labelledby="sheetTitle">
  <header><span class="s-emb" id="sheetEmb"></span><span class="chip" id="sheetKind"></span><h2 id="sheetTitle"></h2><button id="sheetClose" type="button" aria-label="とじる">×</button></header>
  <div id="sheetBody"></div>
</aside>

<div class="toast" id="toast" role="status"></div>
<div id="flash"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  const $ = s => document.querySelector(s);
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const ON_ZONE = '#141830', INK = '#1E2050';
  const PAL = { pink: '#FF7AC6', magenta: '#FF2D95', purple: '#8B2CF5', lilac: '#D9CCFF', cyan: '#4CD3FF', lime: '#7EEA43', yellow: '#FFE63B', orange: '#FF9A1F', blue: '#3F6EFF', gold: '#FFC83A' };
  const RAINBOW = ['#FF7AC6', '#B06BFF', '#4CD3FF', '#7EEA43', '#FFE63B', '#FF9A1F', '#FF7AC6'];

  if (!window.THREE) { $('#fallback').hidden = false; return; }

  // ---- 色と図形の道具 ------------------------------------------------------
  function gradAt(stops, t) {
    t = clamp(t, 0, 1);
    const n = stops.length - 1, f = t * n, i = Math.min(n - 1, Math.floor(f));
    return new THREE.Color(stops[i]).lerp(new THREE.Color(stops[i + 1]), f - i);
  }
  function paint(geo, fn) {
    const p = geo.attributes.position, cols = new Float32Array(p.count * 3);
    for (let k = 0; k < p.count; k++) { const c = fn(p.getX(k), p.getY(k), p.getZ(k)); cols[k * 3] = c.r; cols[k * 3 + 1] = c.g; cols[k * 3 + 2] = c.b; }
    geo.setAttribute('color', new THREE.BufferAttribute(cols, 3));
    return geo;
  }
  function hexA(hex, a) {
    const c = new THREE.Color(hex);
    return `rgba(${Math.round(c.r * 255)},${Math.round(c.g * 255)},${Math.round(c.b * 255)},${a})`;
  }
  function rr(ctx, x, y, w, h, r) {
    r = Math.min(r, h / 2, w / 2);
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
    ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r); ctx.lineTo(x + r, y + h);
    ctx.arcTo(x, y + h, x, y + h - r, r); ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
  }
  function rainbowGrad(ctx, x0, y0, x1, y1) {
    const g = ctx.createLinearGradient(x0, y0, x1, y1);
    RAINBOW.forEach((c, k) => g.addColorStop(k / (RAINBOW.length - 1), c));
    return g;
  }

  // エンブレム（属性・エリアの印）とUIアイコン。24×24の線画
  const EMB = {
    planet: [['M12 6.5a5.5 5.5 0 1 0 0 11a5.5 5.5 0 1 0 0-11Z', 'fill'], ['M1.8 13.2c0-1.9 4.6-4.4 10.2-5.4s10.2-.5 10.2 1.4-4.6 4.4-10.2 5.4S1.8 15.1 1.8 13.2Z', 'stroke']],
    diamond: [['M12 2.5 20.5 12 12 21.5 3.5 12Z', 'stroke'], ['M12 7.5 16 12 12 16.5 8 12Z', 'fill']],
    star: [['M12 1.5c.9 6.1 3.9 9.1 10.5 10.5-6.6 1.4-9.6 4.4-10.5 10.5-.9-6.1-3.9-9.1-10.5-10.5C8.1 10.6 11.1 7.6 12 1.5Z', 'fill']],
    infinity: [['M7 8.2c-2.3 0-4.1 1.7-4.1 3.8s1.8 3.8 4.1 3.8c3.6 0 6.4-7.6 10-7.6 2.3 0 4.1 1.7 4.1 3.8s-1.8 3.8-4.1 3.8c-3.6 0-6.4-7.6-10-7.6Z', 'stroke']],
    lotus: [['M12 3.5c2.6 3 3.4 7.6 0 12.5-3.4-4.9-2.6-9.5 0-12.5Z', 'fill'], ['M12 16c-3.5-.2-7.4-2.6-9-6.6 3.8-.4 7.2 2.2 9 6.6Z', 'fill'], ['M12 16c3.5-.2 7.4-2.6 9-6.6-3.8-.4-7.2 2.2-9 6.6Z', 'fill'], ['M5 19.5c4.6 1.8 9.4 1.8 14 0', 'stroke']],
    clover: [['M12 4a3.6 3.6 0 1 1 0 7.2A3.6 3.6 0 1 1 12 4Z M12 12.8a3.6 3.6 0 1 1 0 7.2 3.6 3.6 0 1 1 0-7.2Z M4 12a3.6 3.6 0 1 1 7.2 0A3.6 3.6 0 1 1 4 12Z M12.8 12a3.6 3.6 0 1 1 7.2 0 3.6 3.6 0 1 1-7.2 0Z', 'fill']]

  const ICON = {

    friends: 'M9 11.2a3.6 3.6 0 1 0 0-7.2 3.6 3.6 0 0 0 0 7.2Z M2.6 20c.5-3.5 3.1-5.8 6.4-5.8s5.9 2.3 6.4 5.8 M15.6 4.3a3.6 3.6 0 0 1 0 6.6 M17.6 14.6c2 .7 3.4 2.6 3.8 5.4',
    event: 'M4 6.5h16v13.5H4Z M4 10.5h16 M8.5 3.8v4 M15.5 3.8v4',
    shop: 'M3 4.5h2.6l2.1 10h10.2l2.3-7H6.6 M9.6 19.6h.01 M16.8 19.6h.01',

  };
  const svgEmb = id => `<svg viewBox="0 0 24 24" aria-hidden="true">${EMB[id].map(([d, m]) => m === 'fill' ? `<path d="${d}" fill="currentColor"/>` : `<path d="${d}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}</svg>`;
  const svgIcon = id => `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${ICON[id]}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  function drawEmblem(ctx, id, cx, cy, size, color) {
    ctx.save(); ctx.translate(cx - size / 2, cy - size / 2); ctx.scale(size / 24, size / 24);
    EMB[id].forEach(([d, m]) => {
      const p = new Path2D(d);
      if (m === 'fill') { ctx.fillStyle = color; ctx.fill(p); }
      else { ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(p); }
    });
    ctx.restore();
  }

  // ---- 世界の配置 ------------------------------------------------------
  const PLAZA_R = 24, ISLAND_R = 17, ISLAND_D = 72, BRIDGE_W = 5, AV_R = 0.6;
  const BR_A = PLAZA_R - 1, BR_B = ISLAND_D - ISLAND_R + 1;
  const ZONES = [
    { id: 'shop', emb: 'diamond', name: 'オフィス通り', kind: 'はたらく', desc: 'アイデアと仕事が育つ街。Origin.のオフィスへようこそ' },
    { id: 'office', emb: 'infinity', name: 'ARCA区役所', kind: '行政サービス', desc: '住所の変更や証明書の発行ができる窓口' },
    { id: 'game', emb: 'star', name: 'ゲームセンター', kind: 'あそぶ', desc: 'ゲーム機に近づいて、ポーカーをはじめよう' },
    { id: 'stage', emb: 'lotus', name: 'ライブステージ', kind: 'イベント', desc: 'ライブやトークイベントの会場' },
    { id: 'park', emb: 'clover', name: 'そよかぜ公園', kind: '交流', desc: 'ニュースを読んで、気になる話題をみんなで話そう' }
  ];
  ZONES.forEach((z, i) => {
    z.i = i; z.a = -Math.PI / 2 + i * TAU / 5;
    z.ux = Math.cos(z.a); z.uz = Math.sin(z.a);
    z.cx = z.ux * ISLAND_D; z.cz = z.uz * ISLAND_D;
    z.rot = Math.atan2(-z.ux, -z.uz); // 島のローカル+zが中央広場を向く
    z.color = cssVar('--z-' + z.id) || '#888888';
  });
  const STAGE = ZONES.findIndex(z => z.id === 'stage');
  const SHOP = ZONES.findIndex(z => z.id === 'shop'), OFFICE = ZONES.findIndex(z => z.id === 'office'), GAME = ZONES.findIndex(z => z.id === 'game'), PARK = ZONES.findIndex(z => z.id === 'park');
  const PLAZA = { name: '中央広場', kind: 'ワールドコアの真下', desc: '5つのエリアへの道がここから伸びている', emb: 'planet' };

  const LINES = {
    plaza: ['こんにちは！', 'コア、今日もきれい', '今日は人が多いね', 'はじめまして〜', 'ライブ何時から？', '待ち合わせ中'],
    shop: ['今日もいい仕事にしよう', 'Origin.のオフィスは中央だよ', '新しいアイデアが浮かんだ', '一緒に作ってみよう'],
    office: ['手続き3分で終わった', '住所変更しなきゃ', '窓口すいてる', '家から出なくていいの助かる'],
    game: ['もう1回！', 'ハイスコア出た！', '対戦しよ', 'あと少しだった…'],
    stage: ['ライブ楽しみ！', '最前列いきたい', '〜♪', 'いい曲！'],
    park: ['ひとやすみ', 'いい風', 'のんびりしよ', 'ここ落ち着く']
  };
  const REPLIES = ['いいね！', 'わかる〜', 'こんにちは！', 'へえ〜', 'たしかに', 'よろしくね！'];
  const NAMES = ['ミント', 'ポポ', 'ノア', 'ハル', 'ルカ', 'ソル', 'キキ', 'モモ', 'リン', 'タオ', 'ユズ', 'ナギ', 'コハク', 'レオ', 'ミオ', 'アオ', 'ココ', 'テト', 'ヒナ', 'ジン', 'サク', 'ニコ', 'ルル', 'カイ', 'メイ', 'トワ', 'スズ', 'ロロ'];
  const AV_TYPES = [{ id: 'normal', label: 'ノーマル' }, { id: 'slim', label: 'スリム' }, { id: 'wide', label: 'ワイド' }, { id: 'dress', label: 'ドレス' }, { id: 'mascot', label: 'マスコット' }];
  const HOODIES = [{ c: '#F7F6FF', label: 'ホワイト' }, { c: '#DCD2FF', label: 'ラベンダー' }, { c: '#2A2D45', label: 'ブラック' }, { c: '#FFD3EC', label: 'ピンク' }];
  const ACCENTS = [{ c: '#8B2CF5', label: 'パープル' }, { c: '#FF2D95', label: 'マゼンタ' }, { c: '#4CD3FF', label: 'シアン' }, { c: '#7EEA43', label: 'ライム' }, { c: '#FFE63B', label: 'イエロー' }, { c: '#FF9A1F', label: 'オレンジ' }];
  const LEDS = [{ c: '#4CD3FF', label: 'シアン' }, { c: '#7EEA43', label: 'ライム' }, { c: '#FFE63B', label: 'イエロー' }, { c: '#FF7AC6', label: 'ピンク' }];
  const MODS = [{ id: 'none', label: 'なし' }, { id: 'bunny', label: 'うさ耳' }, { id: 'halo', label: '天使の輪' }, { id: 'horns', label: 'ツノ' }, { id: 'wings', label: 'はね' }, { id: 'phones', label: 'ヘッドホン' }, { id: 'goggles', label: 'ゴーグル' }];
  const EMOTES = [{ id: 'smile', label: 'スマイル' }, { id: 'wink', label: 'ウィンク' }, { id: 'surprise', label: 'おどろき' }, { id: 'heart', label: 'ハート' }, { id: 'think', label: '考え中' }, { id: 'fire', label: 'やる気' }, { id: 'excite', label: 'こうふん' }];
  const SCHEDULE = [{ t: '19:00', name: 'オープニングDJ', who: 'DJルカ' }, { t: '20:00', name: 'トーク「仮想都市で暮らす」', who: 'ゲスト3人' }, { t: '21:00', name: 'みんなでカラオケ大会', who: '参加自由' }];
  const SHOWCASE = [
    { label: 'エンジェル', expr: 'heart', look: { type: 'dress', hoodie: '#FFD3EC', accent: '#FF2D95', led: '#FF7AC6', mod: 'halo' } },
    { label: 'ストリート', expr: 'fire', look: { type: 'wide', hoodie: '#F7F6FF', accent: '#8B2CF5', led: '#7EEA43', mod: 'phones' } },
    { label: 'ラビット', expr: 'smile', look: { type: 'mascot', hoodie: '#F7F6FF', accent: '#4CD3FF', led: '#4CD3FF', mod: 'bunny' } }
  ];
  const RANK_NPC = [['キキ', 198], ['レオ', 214], ['ミント', 236], ['ソル', 251], ['ハル', 268], ['ポポ', 289]];
  const WISHES = ['ライブが成功しますように', 'みんなと仲良くなれますように', '明日も晴れますように', '新しいパーツが当たりますように', 'また会えますように'];

  function toWorld(i, lx, lz) {
    const z = ZONES[i], c = Math.cos(z.rot), s = Math.sin(z.rot);
    return { x: z.cx + lx * c + lz * s, z: z.cz - lx * s + lz * c };
  }
  const obstacles = [];
  const obsLocal = (i, lx, lz, r) => { const p = toWorld(i, lx, lz); obstacles.push({ x: p.x, z: p.z, r }); };

  function regionOf(x, z) {
    if (x * x + z * z <= (PLAZA_R - AV_R) ** 2) return { t: 'plaza' };
    for (const Z of ZONES) {
      const dx = x - Z.cx, dz = z - Z.cz;
      if (dx * dx + dz * dz <= (ISLAND_R - AV_R) ** 2) return { t: 'island', i: Z.i };
    }
    for (const Z of ZONES) {
      const t = x * Z.ux + z * Z.uz, p = Math.abs(-x * Z.uz + z * Z.ux);
      if (t >= BR_A - 2 && t <= BR_B + 2 && p <= BRIDGE_W / 2 - 0.45) return { t: 'bridge', i: Z.i };
    }
    return null;
  }
  const regionKey = r => !r ? null : r.t === 'plaza' ? 'plaza' : r.t === 'island' ? r.i : 'b' + r.i;
  const gateP = i => ({ x: ZONES[i].ux * (PLAZA_R - 3), z: ZONES[i].uz * (PLAZA_R - 3) });
  const gateI = i => ({ x: ZONES[i].ux * (ISLAND_D - ISLAND_R + 3), z: ZONES[i].uz * (ISLAND_D - ISLAND_R + 3) });

  // 広場と島は道だけでつながるので、道の両端を経由点にする
  function route(fx, fz, tx, tz) {
    const a = regionOf(fx, fz), b = regionOf(tx, tz);
    if (!b) return [];
    const pts = [];
    if (a && !(a.t === b.t && a.i === b.i)) {
      if (a.t === 'island') { if (b.t === 'bridge' && b.i === a.i) pts.push(gateI(a.i)); else pts.push(gateI(a.i), gateP(a.i)); }
      else if (a.t === 'bridge') { if (b.t === 'island' && b.i === a.i) pts.push(gateI(a.i)); else pts.push(gateP(a.i)); }
      const sameArm = a.t !== 'plaza' && a.i === b.i;
      if (b.t === 'island' && !sameArm) pts.push(gateP(b.i), gateI(b.i));
      else if (b.t === 'bridge' && !sameArm) pts.push(gateP(b.i));
    }
    pts.push({ x: tx, z: tz });
    return pts;

  const areaPlatGeos = {};
  function areaPlatGeo(r) {

  // 下に伸びる光の柱と先端の光。ダークは加算（にじむ光）、ライトは白い雲の上で白く飛ばないよう通常の重ね方の金色にする（drawPlaza で切り替え）
  const areaShaftMat = new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });

  function areaTipGlow(parent, color, s, y, lit, f) {

  // 浮遊プラットフォーム：白い丸い縁＋側面の光る帯＋段のある裏側＋光るコア＋下に伸びる光
  // opt = { stops: 帯の色, segs: 区切りの数（なしならグラデーション） }
  function platform(parent, r, opt) {
    opt = opt || {};

  // 床：光沢のある下地（map）＋光るリングのレイヤー（emissiveMap）
  function floorDecal(parent, r, tex, glow) {

  // 区切りのあるリング（gap が 0 のときは継ぎ目に玉ができないよう端を平らに）

  // テーマごとの床の調子。ラウンド2の光（半球光0.4＋太陽0.7＋環境マップ L=1.0、明るい所を抑えるカーブ arcaShoulder）で撮り直して決めた。

  function floorBase(ctx, S, R, u, ppu) {

  // 小さな浮島（サテライト）。上面は g の中で y=0。B が上に飾りを載せる

  const FS = isTouch ? 1024 : 2048;

    return paint(g, (x, y) => gradAt(RAINBOW, clamp(-y / 0.6, 0, 1)));
  });
  const avRibbonDGeo = () => G('avRibbonD', () => {
    const g = new THREE.PlaneGeometry(0.07, 0.6, 1, 8); g.translate(0, -0.3, 0);
    const p = g.attributes.position;
    for (let i = 0; i < p.count; i++) { const t = -p.getY(i) / 0.6; p.setX(i, p.getX(i) - 0.16 * t * t); }
    return paint(g, (x, y) => gradAt(RAINBOW, clamp(-y / 0.6, 0, 1)));
  });
  // 厚底: scale y 0.5k で地面から 0〜0.17k。紫 0〜0.067k・黄色の線 0.067k〜0.10k・上は白（ドレスは黄色・ラベンダー）
  const avSoleGeo = dress => G(dress ? 'avSoleD2' : 'avSole2', () => paint(new THREE.SphereGeometry(0.17, 18, 12),
    (x, y) => new THREE.Color(dress ? (y < -0.035 ? PAL.yellow : y < 0.03 ? '#E6DAFF' : '#FFFFFF') : (y < -0.035 ? '#7A3CF5' : y < 0.03 ? PAL.yellow : '#FFFFFF'))));
  // 甲（底より細い・下の縁はラベンダー・かかと寄りの横に黄色の当て布）とハイカットの筒（上の縁が紫）
  const avShoeGeo = () => G('avShoeUp', () => paint(new THREE.SphereGeometry(0.17, 20, 12), (x, y, z) =>
    new THREE.Color(y < -0.07 ? '#E9E3FF' : (Math.abs(x) > 0.12 && y < 0.04 && z < 0.05) ? PAL.yellow : '#FFFFFF')));
  const avShoeTopGeo = () => G('avShoeTop', () => paint(new THREE.CylinderGeometry(0.1, 0.125, 0.2, 16, 4), (x, y) => new THREE.Color(y > 0.04 ? '#7A3CF5' : '#FFFFFF')));

  // 人型の頭は顎を絞った卵形。耳・鼻は同じジオメトリにまとめ、髪も一体で共有する。
  function avHumanHeadGeo() {
    return G('avHumanHead3', () => {
      const g = new THREE.SphereGeometry(.46, 28, 20), p = g.attributes.position;
      for (let i = 0; i < p.count; i++) {
        const y = p.getY(i), jaw = 1 - Math.max(0, -y / .46) * .16;
        p.setXYZ(i, p.getX(i) * .83 * jaw, y, p.getZ(i) * .78);
      }
      g.computeVertexNormals();
      return objMerge([[g, '#FFFFFF', objMat4(0, 0, 0, 0, 0, 0, 1)],
        ...[-1, 1].map(sign => [sphG(.1, 12, 10), '#FFFFFF', objMat4(sign * .366, -.025, .015, 0, 0, sign * .1, .55, 1, .65)]),
        [sphG(.058, 12, 10), '#FFFFFF', objMat4(0, -.065, .369, .18, 0, 0, .65, 1.3, .85)]]);
    });
  }
  function avHumanHairGeo(type) {
    return G('avHumanHair3' + type, () => {
      const colors = { normal: ['#352D35', '#514049'], slim: ['#C5C1D3', '#E7E0E5'], wide: ['#322B29', '#564138'], dress: ['#AD647E', '#D990A6'] };
      const [base, light] = colors[type] || colors.normal, long = type === 'dress';
      const cap = new THREE.SphereGeometry(.47, 24, 12, 0, TAU, 0, 1), p = cap.attributes.position, uv = cap.attributes.uv;
      for (let i = 0; i < p.count; i++) {
        const phi = uv.getX(i) * TAU, front = Math.max(0, Math.sin(phi));
        const theta = (1 - uv.getY(i)) * ((long ? 2.0 : 1.82) - front * (long ? .87 : .69));
        p.setXYZ(i, -.47 * Math.cos(phi) * Math.sin(theta), .47 * Math.cos(theta), .47 * Math.sin(phi) * Math.sin(theta));
      }
      cap.computeVertexNormals();
      const a = [[cap, base, objMat4(0, .045, -.014, 0, 0, 0, .88, 1, .86)]];
      // 斜めに重なる前髪と側頭部。球を並べた冠にせず、細長い房が額の輪郭をつくる。
      for (let i = 0; i < 7; i++) {
        const x = -.29 + i * .092, y = .265 + .045 * Math.sin(i * 1.7);
        a.push([sphG(.1, 12, 10), i % 3 === 0 ? light : base, objMat4(x, y, .283 - Math.abs(x) * .18, -.24, -.12, -.44 + i * .045, .67, 1.8, .6)]);
      }
      [-1, 1].forEach(sign => {
        a.push([sphG(.1, 12, 10), base, objMat4(sign * .35, long ? -.12 : .06, .015, -.18, 0, sign * -.10, .72, long ? 3.8 : 1.85, 1.25)]);
        if (long) a.push([sphG(.1, 12, 10), light, objMat4(sign * .27, -.30, -.20, -.18, 0, sign * -.08, .85, 3.8, 1.3)]);
      });
      return objMerge(a);
    });
  }

  // ---- 頭（住民の人型ヘッド／マスコットのマスク＋共通アクセサリー） ----
  function avHead(q) {
    const { look, b, A, parts, mesh, grp } = q, mascot = q.type === 'mascot', mod = look.mod;
    const h = grp(0, b.headY, 0); h.scale.setScalar(b.HS);
    if (mascot) {
      // 縦長の卵形の体（幅0.88×高さ1.0、上が細い）。下側をうっすらラベンダーに。カバーと縁は作らない
      mesh(G('avMBody2c', () => paint(avLathe('avMBody2', [[0, -0.5], [0.26, -0.49], [0.38, -0.42], [0.43, -0.26], [0.44, -0.06], [0.42, 0.12], [0.37, 0.28], [0.27, 0.41], [0.14, 0.48], [0, 0.5]], 32),
        (x, y) => avUnderTint(y + 0.5, '#DCD3F7', '#F0ECFF'))), avShellMat, 0, 0, 0, h);
    } else {
      mesh(avHumanHeadGeo(), q.skin, 0, 0, 0, h);
      mesh(avHumanHairGeo(q.type), avHairMat, 0, 0, 0, h);
    }
    // マスク（visor）と表情（face）は同じ位置・同じ倍率。
    // マスコットは体の上から3割あたり。体が丸く前へ張り出すので、少し前・大きめにして見える範囲を幅6割×高さ3割弱にする
    const vp = mascot ? [0, 0.16, 0.29] : [0, -.012, .012], vs = mascot ? [0.66, 0.5, 0.42] : [.99, 1, .99];
    if (mascot) mesh(sphG(0.37, 28, 18), avVisorMat, vp[0], vp[1], vp[2], h).scale.set(vs[0], vs[1], vs[2]);
    const fm = mascot
      ? new THREE.MeshBasicMaterial({ map: faceTex('basic', look.led), transparent: true, depthWrite: false })
      : new THREE.MeshStandardMaterial({ map: faceTex('basic', look.led, true), transparent: true, depthWrite: false, roughness: .95, polygonOffset: true, polygonOffsetFactor: -1 });
    const face = mesh(GEO.face, fm, vp[0], vp[1], vp[2], h); face.scale.set(vs[0], vs[1], vs[2]);
    parts.head = h; parts.faceMat = fm; parts.face = face; parts.faceSY = vs[1];
    // イヤーユニット: 白い円筒（ふたは黄色）＋虹色の太いリング。ヘッドホンのときは ×1.3、マスコットは小さなつまみ（×0.62）
    const ek = (mod === 'phones' ? 1.3 : 1) * (mascot ? 0.62 : 1), ex = mascot ? 0.41 : 0.5, ey = mascot ? 0.15 : -0.02;
    const earMats = avMat('earMats2', () => [avShellMat, cm(PAL.yellow, 0.25), cm(PAL.yellow, 0.25)]);
    if (mascot || mod === 'phones') [-1, 1].forEach(s2 => {
      const e = mesh(avEarGeo(), earMats, s2 * ex, ey, 0, h); e.rotation.z = Math.PI / 2; e.scale.setScalar(ek);
      const r = mesh(avEarRingGeo(), MAT.glow, s2 * (ex + 0.065 * ek), ey, 0, h); r.rotation.y = Math.PI / 2; r.scale.setScalar(ek);
      parts.earRings.push(r);
    });
    // アンテナ（マスコットのうさ耳のときは作らない）
    if (mascot && mod !== 'bunny') {
      const an = grp(0, 0.425, 0, h);
      mesh(GEO.stick, avStickMat, 0, 0.12, 0, an);
      mesh(avTipGeo(), MAT.glow, 0, 0.25, 0, an);
      parts.antenna = an;
    }
    if (mod === 'bunny') [-1, 1].forEach(s2 => {
      const eg = grp(s2 * (mascot ? 0.16 : 0.2), 0.42, mascot ? -0.04 : -0.06, h);
      eg.rotation.set(-0.12, 0, -s2 * (mascot ? 0.22 : 0.2));
      if (mascot) {
        mesh(avBunnyGeo(null), avShellMat, 0, 0.38, 0, eg).scale.set(0.72, 3.0, 0.48);
        mesh(G('avEarIn', () => paint(new THREE.SphereGeometry(0.13, 16, 12), (x, y) => (y > 0 ? gradAt([PAL.yellow, PAL.pink, PAL.cyan, PAL.purple], y / 0.13) : new THREE.Color('#FFFFFF')))),
          avVCMat, 0, 0.4, 0.04, eg).scale.set(0.4, 2.5, 0.22);
      } else {
        mesh(avBunnyGeo(look.accent), avShellMat, 0, 0.3, 0, eg).scale.set(0.7, 2.5, 0.45);   // 外側の白＋内側の差し色を1つに
      }
      parts.ears.push(eg);
    });
    if (mod === 'halo') {
      const r = mesh(G('avHalo', () => paint(new THREE.TorusGeometry(0.42, 0.024, 8, 64), (x, y) => new THREE.Color(Math.floor(((Math.atan2(y, x) / TAU) + 1) * 10) % 2 ? '#FFFFFF' : PAL.yellow))), MAT.glow, 0, 0.82, 0, h);
      r.rotation.x = Math.PI / 2 - 0.2;
    }
    if (mod === 'horns') [-1, 1].forEach(s2 => {
      // マスコットは体の上が細いので内側・低めに
      const hn = mesh(G('avHorn', () => paint(new THREE.ConeGeometry(0.065, 0.3, 14, 4), (x, y) => new THREE.Color(y > 0.06 ? PAL.yellow : '#FFFFFF'))), avVCMat, s2 * (mascot ? 0.18 : 0.25), mascot ? 0.44 : 0.5, 0.02, h);
      hn.rotation.set(-0.15, 0, -s2 * (mascot ? 0.42 : 0.32));
    });
    // ヘッドホンのバンド（半円。耳から頭の上を通る）。殻にくっつくと見えないので少し浮かせて太めに
    if (mod === 'phones') mesh(G('avPhones', () => new THREE.TorusGeometry(0.53, 0.05, 10, 36, Math.PI)), gm('#FFFFFF'), 0, ey, -0.04, h).scale.set(mascot ? 0.85 : 1.04, mascot ? 0.75 : 1, 1);
    if (mod === 'goggles') {
      // 頭の形に沿う輪（殻と同じ倍率の入れ物の中で、中心を通る大きな円を前上がりに傾ける）＋額のレンズ
      const gg = grp(0, 0, 0, h); if (!mascot) gg.scale.set(1.08, 0.95, 1.0);
      const GA = mascot ? 0.72 : 0.85, R = mascot ? 0.47 : 0.465, LR = R + 0.045;
      mesh(G('avGogBand' + R, () => new THREE.TorusGeometry(R, 0.028, 8, 48)), A, 0, 0, 0, gg).rotation.x = Math.PI / 2 - GA;
      const lens = mesh(sphG(0.2, 20, 12), avGoggleMat, 0, LR * Math.sin(GA), LR * Math.cos(GA), gg);
      lens.rotation.x = -GA; if (mascot) lens.scale.set(1.0, 0.5, 0.42); else lens.scale.set(1.25, 0.55, 0.45);
    }
    if (q.type === 'dress') [-1, 1].forEach(s2 => {
      mesh(G('avTassel', () => paint(new THREE.SphereGeometry(0.06, 12, 10), (x, y) => gradAt(['#FFFFFF', '#C9B4FF', '#6FD8FF'], (0.06 - y) / 0.12))),
        avVCMat, s2 * 0.56, -0.26, 0, h).scale.set(0.8, 2.4, 0.8);
    });
  }

  // ---- パーカー（ノーマル・スリム・ワイド） ----
  function avTorso(q) {
    const { look, b, A, mesh, grp, type } = q, tw = b.tw, h = b.sh - b.hem;
    const H = cm(look.hoodie, 0, { roughness: 0.8, envMapIntensity: AV_CLOTH_ENV });
    const tm = avMat(`tor${look.hoodie}${look.accent}${type}`, () => new THREE.MeshStandardMaterial({ map: avHoodieTex(look.hoodie, look.accent, tw, h), roughness: 0.8, side: THREE.DoubleSide, envMapIntensity: AV_CLOTH_ENV }));
    mesh(G('avTorso' + type, () => new THREE.CylinderGeometry(tw * 0.96, tw * 1.04, h, 24, 1, true)), tm, 0, (b.hem + b.sh) / 2, 0).scale.z = 0.8;
    mesh(sphG(tw * 0.96, 20, 10), H, 0, b.sh, 0).scale.set(1, 0.36, 0.8);
    // 襟＝前が開いたフードの縁。輪の 1.6π だけ作り、開いたところを前（+z）へ。内側（首の側）だけ差し色＝裏地、外側はパーカーの色
    // （向きはジオメトリの rotateZ で決める。mesh の rotation.z だと scale の y と軸がずれる）。寝かせた輪なので前後を薄くするのはローカルの y
    const colGeo = G('avCollar' + type + look.hoodie + look.accent, () => {
      const g = new THREE.TorusGeometry(tw * 0.5, 0.06, 10, 28, Math.PI * 1.6); g.rotateZ(Math.PI * 0.7);   // 開きの中心が +y → rotation.x 後に +z
      return paint(g, (x, y) => new THREE.Color(Math.hypot(x, y) < tw * 0.5 ? look.accent : look.hoodie));
    });
    const col = mesh(colGeo, avClothVCMat, 0, b.sh + 0.09, 0); col.rotation.x = Math.PI / 2; col.scale.set(1, 0.85, 1);
    mesh(sphG(0.26, 16, 10), H, 0, b.sh + 0.13, -0.17).scale.set(1.3, 0.8, 0.85);     // 首の後ろにたまったフード
    mesh(cylG(0.06, 0.075, 0.2, 10), q.skin, 0, b.sh + 0.15, 0);                    // 首
    const dg = grp(0, 0, 0); dg.rotation.y = 0.35;                                     // 左胸のディスク（胴の丸みに沿わせる）
    const dm = avDiscMat(look.accent, look.led);
    mesh(GEO.badge, [A, dm, dm], 0, b.sh - 0.2, tw * 0.98 * 0.8 + 0.015, dg).rotation.x = Math.PI / 2;
    if (type === 'wide') mesh(G('avScarf', () => new THREE.TorusGeometry(0.3, 0.13, 12, 24)), cm(PAL.purple, 0, { roughness: 0.85 }), 0, b.sh + 0.1, 0).rotation.x = Math.PI / 2;
  }

  // ---- ドレス（胴衣＋花びらのスカート＋半透明の重ね） ----
  function avDress(q) {
    const { look, A, mesh } = q;
    mesh(cylG(0.2, 0.23, 0.5, 18), cm(look.hoodie, 0, { roughness: 0.5, envMapIntensity: AV_CLOTH_ENV }), 0, 1.5, 0).scale.z = 0.8;
    const band = mesh(G('avBand', () => new THREE.TorusGeometry(0.205, 0.035, 8, 24)), A, 0, 1.68, 0);
    band.rotation.x = Math.PI / 2; band.scale.set(1, 0.8, 1);
    mesh(sphG(0.22, 16, 8), q.skin, 0, 1.75, 0).scale.set(1, 0.4, 0.8);
    mesh(cylG(0.06, 0.075, 0.2, 10), q.skin, 0, 1.9, 0);
    // 花びらのスカート: 真ん中をふくらませ、裾を8枚の丸い花びらに（縦の分割は3のまま。4以上だと持ち上げた裾が上の段を越えて折れる）
    const petal = G('avPetal2', () => {
      const g = new THREE.CylinderGeometry(0.22, 0.6, 0.62, 64, 3, true), p = g.attributes.position;
      for (let i = 0; i < p.count; i++) {
        const y = p.getY(i), t = (0.31 - y) / 0.62, a = Math.atan2(p.getX(i), p.getZ(i));       // t: 0=腰 1=裾
        const k = 1 + 0.14 * Math.sin(Math.PI * Math.min(1, t * 1.15));
        p.setX(i, p.getX(i) * k); p.setZ(i, p.getZ(i) * k);
        if (t > 0.99) p.setY(i, y + 0.15 * Math.pow(1 - Math.abs(Math.sin(a * 4)), 1.6));
      }
      g.computeVertexNormals();
      return paint(g, (x, y) => gradAt(['#FFFFFF', '#F4EEFF', '#DCCBFF', '#B9A0FF'], clamp(0.5 - y / 0.62, 0, 1)));
    });
    mesh(petal, cm(look.hoodie, 0, { vertexColors: true, side: THREE.DoubleSide, roughness: 0.45, envMapIntensity: AV_CLOTH_ENV }), 0, 1.0, 0);
    mesh(G('avUnder', () => paint(new THREE.CylinderGeometry(0.2, 0.7, 0.66, 40, 2, true), (x, y) => gradAt(['#DCCFFF', '#A88CFF', '#6FD0FF'], clamp(0.5 - y / 0.66, 0, 1)))), avUnderMat, 0, 0.97, 0);
  }

  // ---- 腕（ベルスリーブ＋白い手。ドレスは細い腕） ----
  function avArms(q) {
    const { look, b, mesh, grp, parts, type } = q, dress = type === 'dress', [r0, r1, len] = b.slv;
    const sm = dress ? null : avMat(`slv${look.hoodie}${look.accent}`, () => new THREE.MeshStandardMaterial({ map: avSleeveTex(look.hoodie, look.accent), roughness: 0.8, side: THREE.DoubleSide, envMapIntensity: AV_CLOTH_ENV }));
    [-1, 1].forEach(s => {
      const ag = grp(s * b.armX, b.armY, 0); ag.rotation.z = s * b.armZ;
      if (dress) {
        mesh(cylG(r0, r1, len, 10), q.skin, 0, -len / 2, 0, ag);
        mesh(sphG(0.06, 12, 10), q.skin, 0, -len + 0.02, 0, ag);
      } else {
        // ベルスリーブ: 肩は細く、袖口でぐっと開く。点は袖口（下）→ 肩（上）の順。y=0 が肩。
        // テクスチャの縦は長さの割合にそろえる（Lathe の uv.y は点の番号の順なので、そのままだと袖口の3色ラインが細くなる）
        const slvGeo = G('avSlvL' + type, () => {
          const g = new THREE.LatheGeometry([[r1, -len], [r1 * 0.93, -len + 0.06], [r0 + (r1 - r0) * 0.45, -len * 0.55], [r0 * 1.06, -len * 0.22], [r0, 0]].map(([r, y]) => new THREE.Vector2(r, y)), 20);
          const p = g.attributes.position, uv = g.attributes.uv;
          for (let i = 0; i < p.count; i++) uv.setY(i, (p.getY(i) + len) / len);
          return g;
        });
        mesh(slvGeo, sm, 0, 0, 0, ag);
        mesh(sphG(0.075, 12, 10), q.skin, 0, -(len + 0.01), 0.02, ag).scale.set(0.95, 1.25, 0.85);   // 手は袖口からのぞく
      }
      parts.arms.push(ag);
    });
  }

  // ---- 脚（ボトムス・細い脚・厚底スニーカー） ----
  function avLegs(q) {
    const { b, mesh, grp, parts, type } = q, k = b.shoe, L = b.hipY - 0.3, slim = type === 'slim';
    [-1, 1].forEach(s => {
      const lg = grp(s * b.hipX, b.hipY, 0);
      if (type === 'wide') {
        // 足首まであるバルーンパンツ＋脚に沿った曲面の円プリント
        mesh(avLathe('avJog', [[0.13, -0.86], [0.17, -0.8], [0.25, -0.6], [0.27, -0.35], [0.25, -0.1], [0.21, 0.1]], 16), avPantsMat, 0, 0, 0, lg);
        const pm = avMat('print', () => new THREE.MeshStandardMaterial({ map: avDiscTex(PAL.yellow, PAL.orange), alphaTest: 0.5, roughness: 0.6 }));
        mesh(G('avPrint', () => new THREE.CylinderGeometry(0.272, 0.272, 0.24, 12, 1, true, -0.45, 0.9)), pm, 0, -0.42, 0, lg).rotation.y = s * 0.5;
      } else {
        // スリムはハイカットのブーツの上から黒いソックスがひざまで見える
        if (slim) mesh(G('avLegSlim3' + q.skinColor, () => paint(new THREE.CylinderGeometry(0.05, 0.045, L, 10, 8), (x, y) => new THREE.Color(y < 0.22 ? '#2E2B3A' : q.skinColor))),
          cm('#FFFFFF', 0, { vertexColors: true, roughness: 0.6 }), 0, -0.2 - L / 2, 0, lg);
        else mesh(cylG(0.05, 0.045, L, 10), q.skin, 0, -0.2 - L / 2, 0, lg);
        if (type === 'normal') {
          // まっすぐ下がる幅広のひざ丈ショーツ（地面から 0.55〜1.19）。裾を少し外へ開いて、左右の裾の間にすき間を作る
          const sh = mesh(avLathe('avShorts', [[0.175, -0.5], [0.205, -0.47], [0.218, -0.3], [0.21, -0.1], [0.185, 0.06], [0.12, 0.14]], 18), avShortsMat, 0, 0, 0, lg);
          sh.rotation.z = s * 0.07;
        }
        if (slim) mesh(cylG(0.15, 0.165, 0.26, 14), avPantsMat, 0, -0.06, 0, lg);                             // 短いショートパンツ
      }
      // 厚底スニーカー: 底（地面から 0〜0.17k。紫と黄色の線が横から見える）＋細めの甲（0.08k〜0.32k）＋ハイカットの筒
      // （筒はノーマルとスリムだけ。ワイドはバルーンパンツの裾の中に隠れるので作らない。ドレスはパンプス）
      mesh(avSoleGeo(type === 'dress'), avSoleMat, 0, 0.085 * k - b.hipY, 0.055 * k, lg).scale.set(1.15 * k, 0.5 * k, 1.65 * k);
      mesh(avShoeGeo(), avSoleMat, 0, 0.2 * k - b.hipY, 0.05 * k, lg).scale.set(0.95 * k, 0.72 * k, 1.4 * k);
      if (type === 'normal' || slim) mesh(avShoeTopGeo(), avSoleMat, 0, (slim ? 0.4 : 0.36) * k - b.hipY, -0.04 * k, lg).scale.set(k, slim ? 1.5 : 1, k);
      parts.legs.push(lg);
    });
  }

  // ---- リボン（揺らすのは e45） ----
  function avRibbons(q) {
    const { b, mesh, grp, parts, type } = q;
    [-1, 1].forEach(s => {

        ? '<button type="button" class="btn primary wide" id="pen">ペンライトを振る</button><button type="button" class="btn wide" id="fw">花火を上げる</button>'
        : '<button type="button" class="btn primary wide" id="toFront">ステージの前へ行く</button>'}</div>
      <p class="note">今夜の予定はサンプルです。開演までの時間は、この端末の時計で数えています。</p>`, body => {
      const tf = body.querySelector('#toFront'); if (tf) tf.addEventListener('click', () => warpTo(STAGE, [0, -3]));
      const pen = body.querySelector('#pen');
      if (pen) pen.addEventListener('click', () => { player.penT = 10; setExpr(player, 'fire', 5); showBubble(player, '〜♪', 3); replyNearby(2, ['いいね！', '最高〜！', '〜♪'], 'heart'); closeSheet(); });
      const fw = body.querySelector('#fw');
      if (fw) fw.addEventListener('click', () => { [0, 450, 900].forEach(d => setTimeout(stageBurst, d)); setExpr(player, 'surprise', 2); closeSheet(); });
    });
  }
  function openShop(fromKiosk) {
    const z = ZONES[SHOP];
    const items = [
      { emb: 'star', name: 'LEDマスク「スパークル」', sub: '表情が光るマスクの新色', price: '1,800', c: PAL.cyan },
      { emb: 'lotus', name: 'エンジェルウィング', sub: '背中のパーツ', price: '1,200', c: '#C9B2FF' },
      { emb: 'diamond', name: 'ライブ前方エリア券', sub: '今夜19:00の回', price: '600', c: ZONES[STAGE].color }
    ];
    const html = `<p class="lead">${esc(z.desc)}。</p>
      <p class="field">試着コーナー（ショーケースのコーデ）</p><ul class="list">${SHOWCASE.map((s, k) =>
        `<li class="row"><img class="face" alt="" src="${faceIcon(s.expr, s.look.led)}"><span><span class="t">${s.label}</span><br><span class="s">${typeLabel(s.look.type)}・${modLabel(s.look.mod)}</span></span><button type="button" class="btn primary" data-try="${k}">試着する</button></li>`).join('')}</ul>
      ${prevLook ? '<div class="stack"><button type="button" class="btn wide" id="undoTry">もとの見た目に戻す</button></div>' : ''}
      <p class="field">新作パーツ</p><ul class="list">${items.map(it =>
        `<li class="row"><span class="glyph" style="--c:${it.c}">${svgEmb(it.emb)}</span><span><span class="t">${it.name}</span><br><span class="s">${it.sub}・<span class="num">${it.price}</span> コイン</span></span><button type="button" class="btn primary" data-buy>カートへ</button></li>`).join('')}</ul>
      ${fromKiosk ? '' : '<div class="stack"><button type="button" class="btn wide" id="toShop">マルシェ通りへ行く</button></div>'}
      <p class="note">試作版のため、実際の購入はできません。試着した見た目はこのブラウザに保存されます。</p>`;
    openSheet(fromKiosk ? 'zone' : 'shop', z.kind, z.name, z.color, z.emb, html, body => {
      body.querySelectorAll('[data-buy]').forEach(b => b.addEventListener('click', () => toast('カートに入れました（試作版なので購入までは進みません）')));
      body.querySelectorAll('[data-try]').forEach(b => b.addEventListener('click', () => {
        const s = SHOWCASE[Number(b.dataset.try)];
        if (!prevLook) prevLook = Object.assign({}, player.look);
        Object.assign(player.look, s.look); rebuildPlayer(); renderEmotes(); store.set('look', player.look);
        setExpr(player, s.expr, 3); showBubble(player, '似合う？', 3);
        openShop(fromKiosk);
      }));
      const ut = body.querySelector('#undoTry');
      if (ut) ut.addEventListener('click', () => { Object.assign(player.look, prevLook); prevLook = null; rebuildPlayer(); renderEmotes(); store.set('look', player.look); openShop(fromKiosk); });
      const ts = body.querySelector('#toShop'); if (ts) ts.addEventListener('click', () => warpTo(SHOP));
    });
  }
  function openZone(i) {
    if (i === SHOP) { areaOpenOfficeStreet(); return; }
    if (i === GAME) { areaOpenArcade(); return; }
    if (i === PARK) { areaOpenNews(); return; }
    areaOpenLegacyZone(i);
  }
  function areaOpenLegacyZone(i) {
    const z = ZONES[i];
    const lead = `<p class="lead">${esc(z.desc)}。</p>`;
    if (z.id === 'shop') openShop(true);
    else if (z.id === 'stage') openEvents(true);
    else if (z.id === 'office') {
      const sv = [
        { g: '住', name: '住所の変更', sub: '引っ越しの届け出', wait: '待ち 0分' },
        { g: '証', name: '証明書の発行', sub: '住民票の写しなど', wait: '待ち 2分' },
        { g: '相', name: '子育ての相談', sub: '担当の人とビデオで話す', wait: '予約制' }
      ];
      const ticket = `<div class="row"><span class="glyph" style="--c:${z.color}">券</span><span><span class="t">いま呼ばれている番号 <span class="num">${pad3(office.now)}</span></span><br><span class="s">${office.mine ? `あなたの番号 ${pad3(office.mine)}・あと${Math.max(0, office.mine - office.now)}人` : '整理券を取ると、番号で呼ばれます'}</span></span><button type="button" class="btn primary" id="ticket"${office.mine ? ' disabled' : ''}>${office.mine ? '待っています' : '整理券を取る'}</button></div>`;
      openSheet('zone', z.kind, z.name, z.color, z.emb, lead + ticket + `<p class="field">手続きの窓口</p><ul class="list">${sv.map(s =>
        `<li class="row"><span class="glyph" style="--c:${z.color}">${s.g}</span><span><span class="t">${s.name}</span><br><span class="s">${s.sub}・${s.wait}</span></span><button type="button" class="btn primary" data-go>はじめる</button></li>`).join('')}</ul>
        <p class="note">試作版です。本番では、ここから手続きの画面につながる想定です。</p>`, body => {
        body.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => toast('試作版なので、手続きの画面はまだありません')));
        const tk = body.querySelector('#ticket');
        if (tk && !office.mine) tk.addEventListener('click', () => {
          office.mine = office.now + 2; office.t = 0; drawOfficeBoard();
          toast(`${pad3(office.mine)}番の整理券を取りました。ボードで呼ばれます`); setExpr(player, 'smile', 2);
          openZone(i);
        });
      });
    } else if (z.id === 'game') {
      const rankHTML = () => rankRows().map((r, k) => `<li class="row${r.me ? ' me' : ''}"><span class="time">${k + 1}位</span><span class="t">${esc(r.name)}</span><span class="num">${r.ms} ms</span></li>`).join('');
      openSheet('zone', z.kind, z.name, z.color, z.emb, `<p class="lead">反射神経チャレンジ。色が変わったら、すぐに押してください。</p>
        <button type="button" class="pad" id="rgPad" data-s="idle">押してスタート</button>
        <p class="best">このブラウザでのベスト <b class="num" id="rgBest">--</b> ミリ秒</p>
        <p class="field">ランキング</p><ol class="list" id="rankList">${rankHTML()}</ol>
        <p class="field">UFOキャッチャー</p><div class="stack"><button type="button" class="btn primary wide" id="ufoBtn">1回あそぶ</button></div>`, body => {
        const pad = body.querySelector('#rgPad'), bestEl = body.querySelector('#rgBest');
        let best = store.get('rgBest', null), s = 'idle', t0 = 0, tm = null;
        if (best) bestEl.textContent = best;
        const set = (st, text) => { s = st; pad.dataset.s = st; pad.textContent = text; };
        pad.addEventListener('click', () => {
          if (s === 'idle' || s === 'done') { set('wait', '色が変わるまで待って…'); setExpr(player, 'think', 4); tm = setTimeout(() => { set('go', 'いま！'); t0 = performance.now(); }, 1200 + Math.random() * 2200); }
          else if (s === 'wait') { clearTimeout(tm); set('done', 'フライング！ 押してもう一度'); setExpr(player, 'surprise', 2); }
          else if (s === 'go') {
            const ms = Math.round(performance.now() - t0);
            if (best == null || ms < best) { best = ms; store.set('rgBest', ms); bestEl.textContent = ms; refreshRank(); body.querySelector('#rankList').innerHTML = rankHTML(); }
            set('done', `${ms} ミリ秒！ 押してもう一度`);
            showBubble(player, `${ms}ミリ秒！`, 3); setExpr(player, ms < 300 ? 'fire' : 'smile', 2.5);
          }
        });
        const ub = body.querySelector('#ufoBtn');
        ub.addEventListener('click', () => {
          if (claw.mode !== 'move' || claw.req) return;
          ub.disabled = true; ub.textContent = 'アームが動いています…'; setExpr(player, 'think', 4);
          claw.req = () => {
            const win = Math.random() < 0.35, prize = pick(['ARCAくんのぬいぐるみ', '光るリングのキーホルダー', 'マスクのステッカー']);
            if (win) { toast(`ゲット！${prize}`); showBubble(player, 'とれた！', 3); setExpr(player, 'heart', 3); addLog(player.look.name, `${prize}をゲット`, player.look.accent); }
            else { toast('おしい！もう一回'); setExpr(player, 'surprise', 2); }
            if (ub.isConnected) { ub.disabled = false; ub.textContent = 'もう1回あそぶ'; }
          };
        });
        sheetCleanup = () => clearTimeout(tm);
      });
    } else {
      openSheet('zone', z.kind, z.name, z.color, z.emb, lead + `<div class="stack">
        <button type="button" class="btn primary wide" id="rest">ベンチでひとやすみ</button>
        <button type="button" class="btn wide" id="wave">まわりの人に手をふる</button></div>
        <p class="field">願いごとを空へ</p>
        <form class="wish" id="wishForm" autocomplete="off"><input class="text" id="wishText" maxlength="20" placeholder="例：ライブが成功しますように" aria-label="願いごと"><button type="submit" class="btn primary">空へ放つ</button></form>
        <p class="note">池からランタンが空へ上がっていきます。今日は <span class="num">${wishCount}</span> 件上がりました。</p>`, body => {
        body.querySelector('#rest').addEventListener('click', () => { player.sitT = 4; showBubble(player, 'ひとやすみ…', 4); closeSheet(); });
        body.querySelector('#wave').addEventListener('click', () => {
          player.waveT = 1.6; showBubble(player, 'おーい！', 3); addLog(player.look.name, 'おーい！', player.look.accent); setExpr(player, 'smile', 3);
          if (!replyNearby(3, ['やっほー！', 'こんにちは！', 'おーい！', 'いい天気だね'], 'heart')) toast('近くに人がいません。中央広場のほうへ行ってみてください');
          closeSheet();
        });
        body.querySelector('#wishForm').addEventListener('submit', e => {
          e.preventDefault();
          const t = body.querySelector('#wishText').value.trim();
          if (!t) { toast('願いごとを入力してください'); return; }
          releaseLantern(t, player.look.name); showBubble(player, '届きますように', 3); setExpr(player, 'heart', 3);
          closeSheet();
        });
      });
    }
  }

  // ---- テーマ ------------------------------------------------------------
  function redrawTexts() { drawPlaza(); textDraws.forEach(d => d()); }
  function applyTheme() {
    readTheme();
    paintSky(); scene.fog.color.set(T.skyHorizon);
    stars.visible = T.dark;
    objCloudMats.forEach(m => { m.opacity = T.dark ? 0.3 : 0.87; m.color.set(T.dark ? '#8F9ACB' : '#FFFFFF'); });
    objCirrusMat.opacity = T.dark ? .12 : .65;
    MAT.side.color.set(T.side); MAT.white.color.set(T.dark ? '#E4E0FF' : '#FFFFFF'); MAT.lilac.color.set(T.dark ? '#8F80E0' : '#E2D8FF');
    hemi.color.set(T.dark ? '#9AA6FF' : '#FFFFFF'); hemi.groundColor.set(T.dark ? '#2A2466' : '#D9D0FF');
    hemi.intensity = T.dark ? 0.5 : 0.4; sun.intensity = T.dark ? 0.32 : 0.7;
    [MAT.white, MAT.lilac, MAT.side, MAT.gloss, MAT.shell].forEach(m => { m.envMapIntensity = T.dark ? 1 : 0.5; });
    waterMat.emissiveIntensity = T.dark ? 0.8 : 0.35;
    if (fireflies) fireflies.visible = T.dark;
    buildEnv();
    drawPlaza(); ZONES.forEach(drawIsland);
    if (typeof areaThemeHooks !== 'undefined') areaThemeHooks.forEach(f => f());
  }
  applyTheme();
  const mqDark = matchMedia('(prefers-color-scheme: dark)');
  if (mqDark.addEventListener) mqDark.addEventListener('change', applyTheme); else if (mqDark.addListener) mqDark.addListener(applyTheme);
  new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  if (document.fonts) {
    let ft = null;
    const later = () => { clearTimeout(ft); ft = setTimeout(redrawTexts, 120); };
    document.fonts.ready.then(later);
    if (document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', later);
  }

  // ---- ループ ------------------------------------------------------------
  let last = performance.now(), screenT = 0, detailT = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
    const dd = reduceMotion ? dt * 0.2 : dt, bobAmp = reduceMotion ? 0.2 : 1;
    updatePlayer(dt);
    npcs.forEach(n => updateNpc(n, dt));
    syncAvatar(player, dt); npcs.forEach(n => syncAvatar(n, dt));
    spinners.forEach(s => {
      if (s.tumble) { s.m.rotation.x += dd * s.sp * 0.7; s.m.rotation.y += dd * s.sp; } else if (s.sp) s.m.rotation.y += dd * s.sp;
      if (s.bob) s.m.position.y = s.y + Math.sin(time * 1.6 + (s.ph || 0)) * 0.18 * (s.amp || 1) * bobAmp;
    });
    screens.forEach(s => s.m.material.color.setHSL((time * 0.08 + s.o) % 1, 0.75, 0.62));
    beams.forEach((b, k) => { b.rotation.z = Math.sin(time * (reduceMotion ? 0.2 : 0.9) + k * 1.3) * 0.28; });
    floaters.forEach(f => { f.m.rotation.y += dd * f.sp; f.m.position.y = f.y + Math.sin(time * 0.3 + f.ph) * (f.amp == null ? 2 : f.amp) * bobAmp; });
    clouds.forEach(c => { c.a += dd * c.sp2; c.sp.position.x = Math.cos(c.a) * c.r; c.sp.position.z = Math.sin(c.a) * c.r; });
    core.position.y = CORE_BASE + Math.sin(time * 0.6) * 0.5 * bobAmp;
    coreAnim.fins.rotation.y += dd * 0.18;
    coreAnim.info.rotation.y -= dd * 0.25;
    coreAnim.antenna.rotation.z += dd * 0.8; coreAnim.antenna.position.y = 10.15 + Math.sin(time * 1.4) * 0.06 * bobAmp;
    coreAnim.subs.forEach(s => { s.g.position.y = s.y + Math.sin(time * 1.2 + s.ph) * 0.12 * bobAmp; s.g.rotation.y += dd * 0.6; });
    coreAnim.displays.forEach(d => { d.m.position.y = d.y + Math.sin(time * 1.1 + d.ph) * 0.08 * bobAmp; });
    coreAnim.bits.forEach(b => { b.m.position.y = b.y + Math.sin(time + b.ph) * 0.15 * bobAmp; b.m.rotation.x += dd; b.m.rotation.y += dd; });
    if (coreAnim.update) coreAnim.update(dd, time, bobAmp);
    crystal.rotation.y += dd * 0.5; crystal.position.y = 4.2 + Math.sin(time * 1.2) * 0.25 * bobAmp;
    if (marker.visible) { marker.scale.setScalar(Math.max(1, marker.scale.x - dt * 2.5)); marker.material.opacity = 0.65 + Math.sin(time * 6) * 0.25; }
    screenT -= dt; if (screenT <= 0) { screenT = 1 / 12; drawStageScreen(time); }
    objDroneUpdates.forEach(f => f(dt));
    areaUpdates.forEach(f => f(dt));
    updateCamera(dt);
    updateHUD(dt);
    // 遠くの島の細かい飾りは描かない（エリア班が z.areaDetail にまとめた物）
    if ((detailT -= dt) <= 0) { detailT = 0.25; ZONES.forEach(z => { if (z.areaDetail) z.areaDetail.visible = Math.hypot(camera.position.x - z.cx, camera.position.z - z.cz) < 110; }); }
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  setWhere({ t: 'plaza' });
  showBanner('ようこそ', 'ARCAへ', '見上げると、ワールドコアが浮かんでいます', '#B06BFF', 'planet');
  setTimeout(() => { const n = npcs[0]; const t = 'ようこそ！ARCAははじめて？'; showBubble(n, t, 4.5); setExpr(n, 'smile', 4); n.waveT = 1.6; addLog(n.name, t, n.look.accent); }, 1300);
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
